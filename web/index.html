<!doctype html>
<!-- 面板 v2：由 web/server.py 提供（python3 web/server.py --port 8801），登录后访问 /。
     卡片版式对齐参考实现：对方最近说 + 三行判断 + 带百分比的候选。
     卡片结构对齐参考实现：当前会话条 → ✓ 提示 → 对方最近说 → 对话参考（紧张度 + 三行判断）
     → 候选卡片 → 页脚免责。
     面板自己每 30s 自检一次新聊天记录（后端后台线程，见 server.py checker_loop）：
     采集没跑就拉起、有新消息就自动重新生成，浏览器每 5s 刷一次 /api/state 拿结果。
     “复制”只写本机剪贴板；“填入”走 /api/fill 把该句填进 NAS 虚机里微信的输入框
     （只填，不按回车、不发送）。填入默认关闭（只给建议），由后端 fill_enabled 控制。 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回复助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef0f3;color:#1f2329}
.wrap{max-width:760px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#eef0f3;padding:8px 0;z-index:1}
.dot{width:10px;height:10px;border-radius:50%;background:#c2c6cc}.dot.on{background:#07c160}
#sess{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font-size:13px;padding:5px 10px;border:1px solid #d0d4da;background:#fff;border-radius:6px;cursor:pointer;color:#333}
button.pri{background:#07c160;color:#fff;border-color:#07c160}button:disabled{opacity:.5}
button.fill{background:#1a7fdc;color:#fff;border-color:#1a7fdc}

/* ---- 建议卡片 ---- */
.jv{background:#fff;border:1px solid #e6e9ee;border-radius:12px;box-shadow:0 2px 10px #0b12201a;overflow:hidden}
.jvh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #f0f2f5}
.jvh b{font-size:14px}
.jvh .upd{margin-left:auto;font-size:11px;color:#9aa0a6}
.ok{padding:8px 14px;font-size:12px;color:#0a8f4c;background:#f1fbf5;border-bottom:1px solid #e8f6ee}
.say{padding:10px 14px 2px;font-size:13px;color:#5b6168}
.quote{margin:6px 14px 0;padding:8px 10px;background:#f6f7f9;border-left:3px solid #07c160;border-radius:0 6px 6px 0;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.kv{margin:10px 14px 0;font-size:12.5px;line-height:1.7;color:#3d434a}
.kv div{display:flex;gap:8px}
.kv dt{flex:0 0 58px;color:#8b9198}
.kv dd{margin:0;flex:1;word-break:break-word}
.cands{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.cand{border:1px solid #e9ecf1;border-radius:9px;padding:10px 12px;background:#fcfcfd}
.cand.top{border-color:#07c160;background:#f7fdf9}
.ch{display:flex;align-items:center;gap:8px;font-size:12px;color:#6b7076;margin-bottom:6px}
.lb{font-weight:600;color:#2b3036}
.cand.top .lb{color:#07934a}
.pc{margin-left:auto;font-variant-numeric:tabular-nums;color:#8b9198}
.cand.top .pc{color:#07934a;font-weight:600}
.ct{font-size:14.5px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.cf{display:flex;align-items:center;gap:8px;margin-top:8px}
.tag{background:#e8f5ee;color:#058a43;border-radius:4px;padding:1px 6px;font-size:11px;margin-right:auto}
/* ---- 当前会话条 / 对话参考 / 页脚 ---- */
.strip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #f0f2f5;background:#fafbfc}
.av{width:26px;height:26px;border-radius:50%;background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 26px}
.strip .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11px;padding:1px 6px;border-radius:4px;background:#eef1f4;color:#6b7076;white-space:nowrap}
.chip.on{background:#e8f5ee;color:#058a43}
.chip.bad{background:#fdecea;color:#c0392b;cursor:pointer}
.chip.testable{cursor:pointer}
.chip.testing{opacity:.6}
.ttl{margin:12px 14px 0;font-size:12px;color:#8b9198;font-weight:600}
.tv{font-variant-numeric:tabular-nums;color:#3d434a;flex:0 0 26px}
.tn{display:flex;align-items:center;gap:8px;flex:1}
.bar{flex:1;height:6px;max-width:140px;border-radius:3px;background:#eceff3;overflow:hidden}
.bar i{display:block;height:100%}
.disc{padding:10px 14px;font-size:11px;color:#9aa0a6;border-top:1px solid #f0f2f5;text-align:center}
.empty{background:#fff;border:1px dashed #d6dae0;border-radius:10px;text-align:center;color:#888;padding:24px;font-size:13px}
h3{margin:16px 0 6px;font-size:13px;color:#666;font-weight:600}
#msgs{display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:7px 10px;border-radius:8px;word-break:break-word;white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.m small{display:block;font-size:11px;color:#8c9198;margin-bottom:2px}
.me{align-self:flex-end;background:#95ec69}.them{align-self:flex-start;background:#fff}
.unknown{align-self:center;background:#dfe2e6}
.hint{font-size:12px;color:#777;margin:8px 0}
/* ---- 手动补上下文 ---- */
#ctxbar{display:flex;gap:6px;margin-top:10px;align-items:flex-start}
#ctxWho{flex:none;width:96px;padding:8px;border:1px solid #d0d4da;border-radius:6px;font-size:13px;background:#fff;color:#1f2329}
#ctxText{flex:1;min-width:0;padding:8px;border:1px solid #d0d4da;border-radius:6px;font-size:13.5px;resize:none;font-family:inherit;line-height:1.4}
#ctxText:focus,#ctxWho:focus{outline:none;border-color:#07c160}
#ctxAdd{flex:none;padding:8px 14px;font-size:13px}
.m .tag-m{font-size:10.5px;color:#fff;background:#b9bec6;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
/* ---- 首次配置弹窗 ---- */
.modal{position:fixed;inset:0;background:#0b122066;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:470px;max-height:92vh;overflow:auto;padding:16px 16px 12px;box-shadow:0 10px 40px #0003}
.mbox h2{margin:0 0 4px;font-size:16px}
.mbox .sub{margin:0 0 12px;font-size:12px;color:#6b7076;line-height:1.6}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:12px;color:#6b7076;margin-bottom:4px}
.fld input,.fld select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d0d4da;border-radius:6px;font-size:14px;background:#fff;color:#1f2329}
.withbtn{display:flex;gap:6px}
.withbtn input{flex:1;min-width:0}
.note{font-size:11.5px;color:#8b9198;line-height:1.6;margin:8px 0 0}
.stat{display:none;font-size:12.5px;line-height:1.6;margin-top:10px;padding:8px 10px;border-radius:6px;word-break:break-word}
.stat.on{display:block}
.stat.ok{background:#f1fbf5;color:#0a8f4c;border:1px solid #d8f0e2}
.stat.bad{background:#fdf3f3;color:#c0392b;border:1px solid #f3d9d9}
.mrow{display:flex;gap:8px;margin-top:14px}
.mrow button{flex:1;padding:8px;font-size:13.5px}
.src{font-size:11px;color:#a8adb3;margin:10px 0 0;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:6px;display:none;max-width:90%;font-size:13px}
</style></head><body><div class="wrap">
<header><span id="dot" class="dot"></span><span id="sess">—</span>
<button id="cfg">设置</button>
<button id="regen" class="pri">重新生成</button></header>
<div id="panel"></div>
<h3>聊天记录</h3>
<div id="msgs"></div>
<div id="ctxbar">
  <select id="ctxWho"><option value="them">对方说的</option><option value="me">我发的</option></select>
  <textarea id="ctxText" rows="1" placeholder="补一句采集器没读到的对话，给模型多点上下文（回车发送，Shift+回车换行）"></textarea>
  <button id="ctxAdd" class="pri">补进上下文</button>
</div>
</div>
<!-- 首次打开（还没配模型接口）时自动弹这个 -->
<div id="mcfg" class="modal"><div class="mbox">
  <h2>先接一个模型接口</h2>
  <p class="sub">候选回复由你自己账号下的大模型生成，接口地址与 Key 只留在本机面板目录里（权限 600），不进仓库、不上传</p>
  <label class="fld"><span>厂商</span><select id="cProv"></select></label>
  <label class="fld"><span>接口地址</span><input id="cBase" placeholder="https://…/v1" spellcheck="false"></label>
  <label class="fld"><span>模型</span><span class="withbtn"><input id="cModel" list="cModels" placeholder="deepseek-flash" spellcheck="false"><button id="cPull" class="mini">拉取模型列表</button></span><datalist id="cModels"></datalist></label>
  <label class="fld"><span>API Key</span><input id="cKey" type="password" autocomplete="off" placeholder="sk-…" spellcheck="false"></label>
  <p class="note" id="cNote"></p>
  <div class="stat" id="cStat"></div>
  <div class="mrow"><button id="cTest">测试连接</button><button id="cSave" class="pri">保存并开始</button><button id="cClose">稍后</button></div>
  <p class="src" id="cSrc"></p>
</div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let session=null,busy=false,lastTs=null,lastKey=null;
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function cut(s,n){s=(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s}
async function api(path,opt){
  const r=await fetch(path,Object.assign({credentials:'same-origin'},opt));
  if(r.status===401){location.href='/login';throw new Error('未登录')}
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
  return d;
}
async function copy(text){
  // navigator.clipboard 只在 https / localhost 下存在，而面板通常是 http://<NAS_IP>，
  // 手机上直接是 undefined —— 所以必须留一条降级路：隐藏 textarea + execCommand。
  if(navigator.clipboard&&window.isSecureContext){
    try{await navigator.clipboard.writeText(text);toast('已复制');return true}
    catch(e){/* 落到下面的降级路 */}
  }
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.select();ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){toast('已复制');return true}
    toast('浏览器不让自动复制，长按文字手动复制吧');
    return false;
  }catch(e2){
    toast('复制失败：'+e2.message+'。请长按文字手动复制');
    return false;
  }
}
async function fillTo(i,btn){
  if(busy)return;
  busy=true;const old=btn.textContent;btn.disabled=true;btn.textContent='填入中…';
  try{
    const r=await api('/api/fill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i})});
    btn.textContent='已填入';toast('已填进虚机微信输入框（'+r.seconds+'s，没发送）');
  }catch(e){
    btn.textContent='失败';toast('填入失败：'+e.message);
  }
  busy=false;
  setTimeout(()=>{btn.textContent=old;btn.disabled=false},4000);
}
function checkText(s){
  if(!s.check_enabled)return '自检关';
  const c=s.check||{};
  if(!c.last_check_utc)return '自检待跑';
  const t=Date.parse(c.last_check_utc);
  if(isNaN(t))return '自检';
  const sec=Math.max(0,Math.round((Date.now()-t)/1000));
  const ago=sec<60?sec+'s前':Math.round(sec/60)+'m前';
  return (c.last_result==='error'?'自检出错 ':'自检 ')+ago;
}
function renderCard(s){
  const p=$('panel');p.textContent='';
  const meta=s.suggestion_meta;
  if(!s.suggestions.length){
    const e=el('div','empty','还没有生成');const b=el('button','pri','生成');b.style.marginTop='10px';
    b.onclick=generate;e.appendChild(el('br'));e.appendChild(b);p.appendChild(e);return;
  }
  const box=el('div','jv');
  const h=el('div','jvh');h.appendChild(el('b',null,'回复建议'));
  let upd='';
  const t0=meta&&meta.ts_utc?new Date(meta.ts_utc):null;
  if(t0&&!isNaN(t0))upd=t0.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' 更新 · ';
  h.appendChild(el('span','upd',upd+s.suggestions.length+' 条候选'));
  box.appendChild(h);

  /* 当前会话条：会话头像 + 名字 + 采集/自检状态 */
  const strip=el('div','strip');
  const nm=s.session||'未识别';
  strip.appendChild(el('div','av',nm.slice(0,1)));
  strip.appendChild(el('span','nm',nm));
  strip.appendChild(el('span','chip'+(s.collecting?' on':''),s.collecting?'采集中':'采集未运行'));
  strip.appendChild(el('span','chip'+(s.check_enabled?' on':''),checkText(s)));
  const link=s.link_test||{};
  const lk=el('span','chip'+(link.state==='ok'?' on':(link.state==='bad'?' bad':''))+' testable',
              '链路 '+(link.testing?'测试中…':link.text));
  lk.onclick=()=>testLink(lk);
  strip.appendChild(lk);
  box.appendChild(strip);

  box.appendChild(el('div','ok','✓ 建议已更新，选一句适合你的回复'));
  if(s.last_other&&s.last_other.text){
    box.appendChild(el('div','say','对方最近说：'));
    box.appendChild(el('div','quote',cut(s.last_other.text,120)));
  }
  const kv=el('div','kv');
  const tn=meta&&meta.tension;
  if(tn){
    const d=el('div');d.appendChild(el('dt',null,'紧张度'));
    const dd=el('dd'),w=el('span','tn');
    w.appendChild(el('span','tv',tn+'/9'));
    const bar=el('span','bar'),i=el('i');
    i.style.width=(tn/9*100)+'%';
    i.style.background=tn<=3?'#07c160':(tn<=6?'#e8a33d':'#e05353');
    bar.appendChild(i);w.appendChild(bar);dd.appendChild(w);
    d.appendChild(dd);kv.appendChild(d);
  }
  const rows=[['建议',meta&&meta.strategy],['可能意图',meta&&meta.intent],['可能需要',meta&&meta.need]];
  for(const [k,v] of rows){
    if(!v)continue;const d=el('div');d.appendChild(el('dt',null,k));d.appendChild(el('dd',null,v));kv.appendChild(d);
  }
  if(kv.children.length){
    box.appendChild(el('div','ttl','对话参考'));
    box.appendChild(kv);
  }
  const list=el('div','cands');
  s.suggestions.forEach((k,i)=>{
    const c=el('div','cand'+(i===0?' top':''));
    const ch=el('div','ch');
    ch.appendChild(el('span','lb',i===0?'推荐回复':('备选 '+i)));
    ch.appendChild(el('span','pc',(k.score!=null?Math.round(k.score)+'%':'—')));
    c.appendChild(ch);
    c.appendChild(el('div','ct',k.text));
    const f=el('div','cf');f.appendChild(el('span','tag',k.style||'—'));
    const fb=el('button','fill','填入');
    if(s.fill_enabled){fb.onclick=()=>fillTo(i,fb);}
    else{fb.disabled=true;fb.textContent='填入（已关）';fb.title='已关闭：目前只给建议，不替你回';}
    f.appendChild(fb);
    const b=el('button',null,'复制');b.onclick=()=>copy(k.text);f.appendChild(b);
    c.appendChild(f);list.appendChild(c);
  });
  box.appendChild(list);
  box.appendChild(el('div','disc','AI 生成内容仅供参考，请自行判断'));
  p.appendChild(box);
}
function render(s){
  const ts=s.suggestion_meta&&s.suggestion_meta.ts_utc;
  if(lastTs&&ts&&ts!==lastTs)toast('检测到新消息，建议已重新生成');
  if(ts)lastTs=ts;
  session=s.session;$('sess').textContent=s.session||'（无会话）';
  $('dot').className='dot'+(s.collecting?' on':'');$('dot').title=s.collecting?'采集中':'采集未运行';
  renderCard(s);
  const m=$('msgs');m.textContent='';
  if(!s.messages.length)m.appendChild(el('div','empty','暂无消息'));
  for(const x of s.messages){
    const d=el('div','m '+(x.sender==='me'||x.sender==='them'?x.sender:'unknown'));
    if(x.time_hint)d.appendChild(el('small',null,x.time_hint));
    d.appendChild(document.createTextNode(x.text||''));
    if(x.manual)d.appendChild(el('span','tag-m','手动'));
    m.appendChild(d);
  }
  lastKey=stateKey(s);
}

// 版本号：内容真变了才重建 DOM。以前每 5 秒无条件整块重绘，用户选着文字
// 就被清掉、按钮点一半就没了。
function stateKey(s){
  const m=s.messages||[],last=m[m.length-1]||{};
  const meta=s.suggestion_meta||{};
  return [meta.ts_utc||'',m.length,last.ts_utc||'',s.collecting?1:0,
          (s.check&&s.check.last_check_utc)||'',(s.suggestions||[]).length,
          m.filter(x=>x.manual).length].join('|');
}
function selecting(){
  const sel=window.getSelection&&window.getSelection();
  return !!(sel&&!sel.isCollapsed&&String(sel).length>0);
}
async function tick(){
  if(busy||document.hidden)return;            // 页面在后台就别轮询了
  const s=await api('/api/state');
  if(stateKey(s)===lastKey)return;            // 没变化：一个 DOM 都不碰
  if(selecting())return;                      // 正在选字：等他选完
  render(s);
}
async function refresh(){
  try{
    render(await api('/api/state'));
    if(!setup){
      await loadSetup();
      // 首次打开且还没配模型接口 —— 直接把配置弹出来，别让用户先撞一次“生成失败”
      if(!setup.configured&&!setupShown)
        openSetup('第一次用：地址已经按厂商填好了，你只需要补一个 API Key');
    }
  }catch(e){if(e.message!=='未登录')toast('刷新失败：'+e.message)}
}
async function generate(){
  if(busy)return;
  if(setup&&!setup.configured){openSetup('还没配模型接口，填完就能生成');return}
  busy=true;$('regen').disabled=true;$('regen').textContent='生成中…';
  try{
    await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(session?{session}:{})});
    await refresh();
  }catch(e){toast('生成失败：'+e.message)}
  busy=false;$('regen').disabled=false;$('regen').textContent='重新生成';
}

/* ---- 首次配置（模型接口） ---- */
let setup=null,setupShown=false;
function presetById(id){return ((setup&&setup.presets)||[]).find(p=>p.id===id)}
function guessPreset(s){
  const b=((s&&s.base_url)||'').replace(/\/+$/,'');
  if(!b)return null;
  return ((setup&&setup.presets)||[]).find(p=>(p.base_url||'').replace(/\/+$/,'')===b)||null;
}
function fillModels(list){
  const dl=$('cModels');dl.textContent='';
  (list||[]).forEach(m=>{const o=document.createElement('option');o.value=m;dl.appendChild(o)});
}
function setStat(cls,txt,detail){
  const e=$('cStat');
  if(!txt&&!detail){e.className='stat';e.textContent='';return}
  e.className='stat on '+(cls||'');e.textContent=txt+(detail?((txt?' ｜ ':'')+detail):'');
}
function applyPreset(id,force){
  const p=presetById(id);if(!p)return;
  if(force||!$('cBase').value)$('cBase').value=p.base_url||'';
  if(force||!$('cModel').value)$('cModel').value=(p.models||[])[0]||'';
  fillModels(p.models);
  $('cNote').textContent=p.note||'';
  $('cSrc').textContent=p.src?('接口来源 '+p.src):'';
  if(!$('cKey').value)$('cKey').placeholder=keyPlaceholder();
}
function keyPlaceholder(){
  const s=(setup&&setup.saved)||{};
  return s.key_set?('已保存 '+s.key_hint+'，留空表示不改'):'sk-…';
}
async function loadSetup(){
  setup=await api('/api/setup');
  const sel=$('cProv');sel.textContent='';
  (setup.presets||[]).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o)});
  return setup;
}
function openSetup(msg){
  setupShown=true;$('mcfg').classList.add('on');
  const s=(setup&&setup.saved)||{};
  $('cBase').value=s.base_url||'';$('cModel').value=s.model||'';$('cKey').value='';
  const p=guessPreset(s);
  $('cProv').value=p?p.id:(s.base_url?'custom':'deepseek');
  applyPreset($('cProv').value,false);
  $('cKey').placeholder=keyPlaceholder();
  setStat('',msg||'','');
}
function closeSetup(){$('mcfg').classList.remove('on')}
function cfgBody(extra){
  return Object.assign({provider_id:$('cProv').value,base_url:$('cBase').value.trim(),
    model:$('cModel').value.trim(),api_key:$('cKey').value},extra||{});
}
async function testConn(){
  const btn=$('cTest');btn.disabled=true;btn.textContent='测试中…';
  setStat('','正在连…','');
  try{
    const r=await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfgBody({dry_run:true}))});
    if(r.models&&r.models.length)fillModels(r.models);
    setStat('ok','✓ '+r.detail,'');
  }catch(e){setStat('bad','✗ '+e.message,'')}
  btn.disabled=false;btn.textContent='测试连接';
}
async function pullModels(){
  const btn=$('cPull');btn.disabled=true;btn.textContent='拉取中…';
  setStat('','正在拉模型列表…','');
  try{
    const model=$('cModel').value.trim();
    $('cModel').value='';
    const r=await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfgBody({list_only:true}))});
    fillModels(r.models);
    if((r.models||[]).length){$('cModel').value=r.models[0];setStat('ok','✓ '+r.detail,'已填第一个，可下拉换');}
    else{$('cModel').value=model;setStat('','',r.detail||'');$('cStat').className='stat on';$('cStat').textContent=r.detail||'';}
  }catch(e){setStat('bad','✗ '+e.message,'')}
  btn.disabled=false;btn.textContent='拉取模型列表';
}
async function saveSetup(){
  const btn=$('cSave');btn.disabled=true;btn.textContent='保存中…';
  try{
    const r=await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfgBody())});
    if(r.state)setup=r.state;
    $('cKey').value='';toast('已保存，开始生成');closeSetup();
    await refresh();
  }catch(e){setStat('bad','✗ '+e.message,'')}
  btn.disabled=false;btn.textContent='保存并开始';
}
$('cProv').onchange=()=>applyPreset($('cProv').value,true);
$('cTest').onclick=testConn;$('cPull').onclick=pullModels;
$('cSave').onclick=saveSetup;$('cClose').onclick=closeSetup;
$('cfg').onclick=async()=>{
  try{if(!setup)await loadSetup();openSetup('换厂商、换 Key、换模型都在这里')}
  catch(e){toast('读取配置失败：'+e.message)}
};
/* ---- 手动补上下文 ---- */
async function addCtx(){
  const btn=$('ctxAdd'),ta=$('ctxText');
  const text=ta.value.trim();
  if(!text){ta.focus();return}
  if(busy)return;
  busy=true;btn.disabled=true;btn.textContent='补入中…';
  try{
    await api('/api/msg',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sender:$('ctxWho').value,text})});
    ta.value='';ta.style.height='';toast('已补进上下文');
    await refresh();
  }catch(e){toast('补入失败：'+e.message)}
  busy=false;btn.disabled=false;btn.textContent='补进上下文';
  ta.focus();
}
// 回车发送、Shift+回车换行；高度随内容长
$('ctxText').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addCtx()}
});
$('ctxText').addEventListener('input',e=>{
  const t=e.target;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';
});
$('ctxAdd').onclick=addCtx;

/* ---- 模型链路测试：点状态条上的「链路」chip，真连一次已保存的接口 ---- */
async function testLink(chipEl){
  if(busy)return;
  busy=true;
  if(chipEl){chipEl.textContent='链路 测试中…';chipEl.classList.add('testing')}
  try{
    const r=await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({test_saved:true})});
    linkResult(r.ok?'ok':'bad',r.detail);
    toast('✓ '+r.detail);
    if(r.models&&r.models.length)fillModels(r.models);
  }catch(e){
    // 401 在 api() 里已跳登录页；其余把原因记到 chip 上
    if(e.message!=='未登录'){linkResult('bad',e.message);toast('链路不通：'+e.message)}
  }
  busy=false;
  await refresh();
}
function linkResult(state,text){
  // 只把这一次结果塞进当前 setup 缓存，5 秒后的 tick 会拿 /api/state 里的权威值盖过去
  if(setup)setup.link_test={state,text};
}
$('regen').onclick=generate;
refresh();
setInterval(()=>{tick().catch(()=>{})},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick().catch(()=>{})});
</script></body></html>
