<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF8F3"/>
      <stop offset="0.55" stop-color="#F5F1E9"/>
      <stop offset="1" stop-color="#EFEADF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.08" r="0.8">
      <stop offset="0" stop-color="#FFFBF4" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#FFF8EC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F2EDE1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.96" cy="1" r="0.75">
      <stop offset="0" stop-color="#E9DFCB" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#EFEBE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEFA"/>
      <stop offset="1" stop-color="#FDFBF5"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#3A342A" flood-opacity="0.09"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#3A342A" flood-opacity="0.06"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.03"/></feComponentTransfer>
    </filter>
    <style>
      .disp { font-family: "Noto Serif CJK SC", "Noto Serif", serif; font-weight: 700; fill: #23221E; }
      .sans { font-family: "Noto Sans CJK SC", "DejaVu Sans", sans-serif; fill: #4F4D47; }
      .caps { font-family: "DejaVu Sans", sans-serif; font-weight: 700; letter-spacing: 8px; fill: #B85F42; }
    </style>
  </defs>

  <rect width="2400" height="1200" fill="url(#paper)"/>
  <rect width="2400" height="1200" fill="url(#glow)"/>
  <rect width="2400" height="1200" fill="url(#glow2)"/>
  <rect width="2400" height="1200" filter="url(#grain)" opacity="0.5"/>

  <text class="caps" x="170" y="234" font-size="32">WECHAT REPLY ASSISTANT</text>
  <rect x="170" y="266" width="96" height="4" rx="2" fill="#C96442" opacity="0.9"/>

  <text class="disp" x="168" y="446" font-size="118" letter-spacing="-1">读你的微信</text>
  <text class="disp" x="168" y="578" font-size="118" letter-spacing="-1">递上三句能发的话</text>

  <text class="sans" x="172" y="696" font-size="41" fill="#4F4D47">在你的 Windows 上安静地只读采集，</text>
  <text class="sans" x="172" y="758" font-size="41" fill="#4F4D47">读完你们最近的对话，</text>
  <text class="sans" x="172" y="820" font-size="41" fill="#4F4D47">给每条消息配三个候选，顺眼就复制走。</text>

  <g transform="translate(172, 878)">
    <rect x="0" y="0" width="612" height="84" rx="42" fill="#FFFAF1" stroke="#E3D2C0" stroke-width="2"/>
    <circle cx="54" cy="42" r="13" fill="#7E8C5A"/>
    <text class="sans" x="90" y="55" font-size="34" font-weight="700" fill="#3E3C37">只给建议 · 绝不替你发</text>
  </g>

  <g transform="translate(1250, 313)">
    <g filter="url(#soft)">
      <rect x="0" y="0" width="420" height="568" rx="32" fill="url(#card)"/>
    </g>
    <circle cx="56" cy="64" r="25" fill="#E8E4DA"/>
    <text class="sans" x="98" y="76" font-size="34" font-weight="700" fill="#3E3C37">林同学</text>
    <rect x="28" y="112" width="364" height="2" fill="#F0ECE2"/>

    <rect x="28" y="156" width="272" height="80" rx="21" fill="#EFECE3"/>
    <text class="sans" x="56" y="206" font-size="30">下周展示你来吗</text>
    <rect x="120" y="264" width="272" height="80" rx="21" fill="#E9E2D6"/>
    <text class="sans" x="148" y="314" font-size="30" fill="#3B3931">来的，我准备下</text>
    <rect x="28" y="372" width="296" height="80" rx="21" fill="#EFECE3"/>
    <text class="sans" x="56" y="422" font-size="30">那正好，我也有事说</text>
    <circle cx="44" cy="490" r="8" fill="#CFCABB"/>
    <circle cx="70" cy="490" r="8" fill="#CFCABB"/>
    <circle cx="96" cy="490" r="8" fill="#CFCABB"/>

    <path d="M432 442 C 486 442, 472 186, 508 172" stroke="#C96442" stroke-width="3.5" fill="none"
          stroke-dasharray="12 11" stroke-linecap="round" opacity="0.85"/>
    <path d="M482 154 L 512 171 L 482 190" stroke="#C96442" stroke-width="4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#soft2)">
      <rect x="510" y="0" width="550" height="196" rx="28" fill="#FFFCF5" stroke="#DEB79E" stroke-width="3"/>
    </g>
    <text class="sans" style="fill:#B85F42" x="544" y="64" font-size="31" font-weight="700">推荐回复</text>
    <text class="sans" style="fill:#B85F42" x="1024" y="64" font-size="31" font-weight="700" text-anchor="end">82%</text>
    <text class="sans" x="544" y="132" font-size="38" fill="#26251F">来的，正好我也想找你</text>
    <g transform="translate(544, 144)">
      <rect x="0" y="0" width="100" height="40" rx="20" fill="#F6E7DE"/>
      <text class="sans" style="fill:#B85F42" x="50" y="27" font-size="24" text-anchor="middle">自然</text>
    </g>

    <g filter="url(#soft2)">
      <rect x="510" y="232" width="550" height="152" rx="26" fill="#FDFBF6" stroke="#EBE5D7" stroke-width="1.8"/>
    </g>
    <text class="sans" style="fill:#A29C8E" x="544" y="270" font-size="25">备选 1</text>
    <text class="sans" style="fill:#A29C8E" x="1024" y="270" font-size="27" text-anchor="end">65%</text>
    <text class="sans" x="544" y="318" font-size="34" fill="#3B3931">来的，几点开始呀</text>
    <g transform="translate(544, 330)">
      <rect x="0" y="0" width="100" height="40" rx="20" fill="#F3EDE4"/>
      <text class="sans" style="fill:#6E6A61" x="50" y="27" font-size="24" text-anchor="middle">简短</text>
    </g>

    <g filter="url(#soft2)">
      <rect x="510" y="416" width="550" height="152" rx="26" fill="#FDFBF6" stroke="#EBE5D7" stroke-width="1.8"/>
    </g>
    <text class="sans" style="fill:#A29C8E" x="544" y="454" font-size="25">备选 2</text>
    <text class="sans" style="fill:#A29C8E" x="1024" y="454" font-size="27" text-anchor="end">48%</text>
    <text class="sans" x="544" y="502" font-size="34" fill="#3B3931">嗯，到时候说吧</text>
    <g transform="translate(544, 514)">
      <rect x="0" y="0" width="100" height="40" rx="20" fill="#F3EDE4"/>
      <text class="sans" style="fill:#6E6A61" x="50" y="27" font-size="24" text-anchor="middle">留余地</text>
    </g>

    <text class="sans" x="1060" y="628" font-size="29" fill="#8E8878" text-anchor="end">示意图 · 演示数据</text>
  </g>
</svg>
